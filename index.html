<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f1"><title>きょうの記録</title><link rel="apple-touch-icon" sizes="512x512" href="diary-icon.png?v=white2"><link rel="icon" type="image/png" href="diary-icon.png?v=white2"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#243a30;background:#f6f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:580px;margin:auto;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:.18em;color:#789084}h1{font-size:27px;margin:5px 0 6px}.date{font-size:13px;color:#70857a}.card{background:white;border-radius:22px;padding:19px;margin-top:18px;box-shadow:0 5px 24px #183b2710}.heading{font-size:14px;font-weight:750;margin-bottom:14px}.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mood{border:2px solid #e9ece6;border-radius:17px;background:#fff;padding:11px 3px 9px;display:flex;align-items:center;flex-direction:column;gap:5px;color:#35483d;font-size:13px;font-weight:700;cursor:pointer}.mood.selected{border-color:#34774d;background:#f1f9ef}.face{width:68px;height:68px}.mood:focus-visible,button:focus-visible{outline:3px solid #407d60;outline-offset:2px}textarea{width:100%;height:150px;border:1px solid #dfe7df;border-radius:14px;padding:14px;font:16px/1.7 inherit;resize:vertical;color:#243a30;background:#fcfdfa}textarea:focus{outline:2px solid #83b99a}.counter{text-align:right;color:#7c8e82;font-size:12px;margin-top:7px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{aspect-ratio:1;border:1.5px dashed #c9d9cb;border-radius:14px;overflow:hidden;position:relative;background:#f5f8f3;display:grid;place-items:center;color:#7a9981;font-size:12px;text-align:center}.photo img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;top:5px;right:5px;border:0;border-radius:50%;background:#243a30d9;color:white;width:27px;height:27px;font-size:17px}.add{width:100%;height:100%;border:0;background:transparent;color:#6d9076;font-size:28px;cursor:pointer}.add small{display:block;font-size:11px}.primary{width:100%;padding:16px;border:0;border-radius:15px;background:#286746;color:white;font-size:16px;font-weight:750;margin-top:18px}.muted{font-size:12px;color:#78897e;line-height:1.6}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid #e3e9e1;display:flex;justify-content:center;padding:11px 10px max(13px,env(safe-area-inset-bottom));gap:12px}.nav button{width:min(31%,160px);border:0;background:transparent;color:#728479;padding:8px;border-radius:12px;font-size:12px}.nav button.active{color:#286746;background:#e9f4e9;font-weight:750}.nav b{display:block;font-size:21px;margin-bottom:3px}.hidden{display:none!important}.calendarhead{display:flex;align-items:center;justify-content:space-between}.calendarhead button,.secondary{border:1px solid #dbe5da;border-radius:11px;background:#fff;color:#2b6446;padding:9px 14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{margin:18px 0 10px;color:#829287;font-size:12px}.day{min-height:54px;border:1px solid transparent;border-radius:11px;background:#f5f8f4;font-size:14px;color:#334c3b;position:relative;padding:7px 0;cursor:pointer}.day.today{border-color:#438b62}.day .dot{display:block;width:9px;height:9px;border-radius:50%;margin:5px auto 0}.day.blank{background:transparent;cursor:default}.entries{margin-top:16px}.entry{border-bottom:1px solid #e8eee8;padding:13px 2px;cursor:pointer}.entry strong{font-size:13px}.entry p{font-size:13px;line-height:1.6;margin:5px 0;color:#536459;white-space:pre-wrap}.notice{margin-top:10px;min-height:18px;color:#28744a;font-size:13px}.setting{display:flex;flex-direction:column;gap:10px;margin-top:14px}.setting button{padding:13px;border-radius:12px;font-size:14px;text-align:left}.warn{color:#a33e35}.pill{border-radius:12px;background:#eff5ee;padding:9px 12px;font-size:13px;color:#55725d;display:inline-block}input[type=file]{display:none}</style></head><body><main>
<section id="todayPage"><div class="top"><div><div class="eyebrow">MY LITTLE JOURNAL</div><h1>今日の記録</h1><div class="date" id="dateText"></div></div><span class="pill" id="dayStatus">未記録</span></div><div class="card"><div class="heading">今日の気分</div><div class="moods" id="moods"></div></div><div class="card"><div class="heading">今日のひとこと</div><textarea id="note" maxlength="200" placeholder="今日を象徴する出来事や、心に残ったことを…"></textarea><div class="counter"><span id="count">0</span> / 200文字</div></div><div class="card"><div class="heading">今日を象徴する写真 <span style="font-weight:400;color:#84958a">（最大3枚）</span></div><div class="photos" id="photos"></div><input id="file" type="file" accept="image/*" multiple><p class="muted">写真は端末内で縮小して保存します。元の写真は変更しません。</p></div><button class="primary" id="save">この日記を保存</button><div class="notice" id="notice" role="status"></div></section>
<section id="calendarPage" class="hidden"><div class="eyebrow">LOOK BACK</div><h1>日記カレンダー</h1><div class="card"><div class="calendarhead"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="days" id="days"></div></div><div class="card"><div class="heading">この月の記録</div><div id="entries" class="entries"></div></div></section>
<section id="settingsPage" class="hidden"><div class="eyebrow">YOUR DATA</div><h1>設定とバックアップ</h1><div class="card"><div class="heading">記録の保管</div><p class="muted">日記と写真は、このブラウザの端末内ストレージに保存します。ブラウザのデータ削除や機種変更に備え、定期的にバックアップしてください。</p><div class="setting"><button class="secondary" id="export">バックアップを書き出す（JSON）</button><button class="secondary" id="importBtn">バックアップから復元する</button><input id="importFile" type="file" accept="application/json,.json"></div><p class="muted">復元すると、現在の記録はバックアップの内容で置き換わります。</p><p class="notice" id="settingsNotice" role="status"></p></div></section>
</main><nav class="nav"><button data-page="today" class="active"><b>✎</b>今日</button><button data-page="calendar"><b>▦</b>カレンダー</button><button data-page="settings"><b>⚙</b>設定</button></nav>
<script>
(()=>{'use strict';const KEY='little-journal-v1';let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}');if(!records||Array.isArray(records)||typeof records!=='object')records={}}catch{records={}}const $=id=>document.getElementById(id);const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=localDate(new Date());let editing=today, mood=null,photos=[],month=new Date();month.setDate(1);const moods=[{id:'good',name:'良い',color:'#ff9e42',edge:'#975124',eyes:'<path d="M23 34 Q30 26 36 34 M44 34 Q50 26 57 34"/>',mouth:'<path d="M26 48 Q40 62 54 48"/>'},{id:'normal',name:'普通',color:'#ffda4c',edge:'#907019',eyes:'<path d="M29 31 V39 M51 31 V39"/>',mouth:'<path d="M29 52 H51"/>'},{id:'bad',name:'悪い',color:'#82b9f3',edge:'#406493',eyes:'<path d="M23 39 Q30 44 36 39 M44 39 Q50 44 57 39"/>',mouth:'<path d="M27 56 Q40 44 53 56"/>'}];function face(m){return `<svg class="face" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="${m.color}" stroke="${m.edge}" stroke-width="3"/><g stroke="#463628" stroke-width="4" stroke-linecap="round" fill="none">${m.eyes}${m.mouth}</g></svg>`}function renderMoods(){$('moods').innerHTML=moods.map(m=>`<button type="button" class="mood ${mood===m.id?'selected':''}" data-mood="${m.id}" aria-pressed="${mood===m.id}">${face(m)}${m.name}</button>`).join('');document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{mood=b.dataset.mood;renderMoods()})}function renderPhotos(){$('photos').innerHTML=photos.map((p,i)=>`<div class="photo"><img src="${p}" alt="写真${i+1}"><button class="remove" type="button" data-remove="${i}" aria-label="写真${i+1}を削除">×</button></div>`).join('')+(photos.length<3?`<div class="photo"><button type="button" class="add" id="addPhoto">＋<small>写真を追加</small></button></div>`:'');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{photos.splice(Number(b.dataset.remove),1);renderPhotos()});if($('addPhoto'))$('addPhoto').onclick=()=>$('file').click()}
function loadDay(day){editing=day;const r=records[day]||{};mood=r.mood||null;photos=Array.isArray(r.photos)?r.photos.slice(0,3):[];$('note').value=r.text||'';$('count').textContent=$('note').value.length;const d=new Date(day+'T12:00:00');$('dateText').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);$('dayStatus').textContent=records[day]?'保存済み':'未記録';$('notice').textContent='';renderMoods();renderPhotos();$('todayPage').querySelector('h1').textContent=day===today?'今日の記録':'過去の記録';show('today')}
function show(page){['today','calendar','settings'].forEach(p=>$(p+'Page').classList.toggle('hidden',p!==page));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='calendar')renderCalendar();window.scrollTo(0,0)}function persist(){localStorage.setItem(KEY,JSON.stringify(records))}$('note').addEventListener('input',()=>{$('count').textContent=$('note').value.length});$('save').onclick=()=>{if(!mood){$('notice').textContent='気分を選んでください。';return}if(!$('note').value.trim()&&!photos.length){$('notice').textContent='文章か写真を追加してください。';return}const old=records[editing];records[editing]={mood,text:$('note').value.trim(),photos,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};try{persist();$('dayStatus').textContent='保存済み';$('notice').textContent='保存しました。'}catch(e){$('notice').textContent='保存容量が不足しています。写真を減らすか、バックアップを作成してください。';if(old)records[editing]=old;else delete records[editing]}};
function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('読み込み失敗'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('画像形式が非対応'));img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}$('file').onchange=async e=>{const files=Array.from(e.target.files).slice(0,3-photos.length);$('notice').textContent='写真を処理しています…';for(const f of files){try{photos.push(await compress(f))}catch{$('notice').textContent='一部の写真を読み込めませんでした。'}}renderPhotos();if(photos.length)$('notice').textContent='写真を追加しました。保存ボタンで確定してください。';e.target.value=''};
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth();$('month').textContent=`${y}年${m+1}月`;const offset=new Date(y,m,1).getDay(),length=new Date(y,m+1,0).getDate();let html='<div class="day blank"></div>'.repeat(offset);for(let n=1;n<=length;n++){const day=localDate(new Date(y,m,n)),r=records[day],c=moods.find(v=>v.id===r?.mood)?.color;html+=`<button class="day ${day===today?'today':''}" data-day="${day}">${n}${c?`<span class="dot" style="background:${c}"></span>`:''}</button>`}$('days').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>loadDay(b.dataset.day));const monthKey=`${y}-${String(m+1).padStart(2,'0')}-`;const days=Object.keys(records).filter(d=>d.startsWith(monthKey)).sort().reverse();$('entries').innerHTML=days.length?days.map(d=>{const r=records[d],name=moods.find(x=>x.id===r.mood)?.name||'未設定';return `<div class="entry" data-entry="${d}"><strong>${Number(d.slice(-2))}日 · ${name} · 写真${r.photos?.length||0}枚</strong><p></p></div>`}).join(''):'<p class="muted">この月の記録はまだありません。</p>';document.querySelectorAll('[data-entry]').forEach(el=>{el.querySelector('p').textContent=records[el.dataset.entry].text||'（写真のみ）';el.onclick=()=>loadDay(el.dataset.entry)})}$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='today')loadDay(today);else show(b.dataset.page)});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'little-journal',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`diary-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);$('settingsNotice').textContent='バックアップを書き出しました。ファイルアプリなどに保存してください。'};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const data=JSON.parse(await file.text());if(data.app!=='little-journal'||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('形式が違います');for(const [date,r] of Object.entries(data.records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!r||typeof r.text!=='string'||r.text.length>200||!moods.some(m=>m.id===r.mood)||!Array.isArray(r.photos)||r.photos.length>3||r.photos.some(p=>typeof p!=='string'||!p.startsWith('data:image/')))throw Error('記録が不正です')}if(!confirm('現在の日記をバックアップの内容で置き換えます。続行しますか？'))return;const before=records;records=data.records;try{persist()}catch(e){records=before;throw e}$('settingsNotice').textContent='復元しました。';loadDay(today)}catch(err){$('settingsNotice').textContent='復元できませんでした：'+err.message}e.target.value=''};loadDay(today)})();
</script></body></html>
